name: Add P3 Sports Fiesta to homepage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-p3-sports-fiesta.yml

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Patch homepage
        run: python .github/scripts/add_p3_sports_fiesta.py
      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add P3 Length Mass and Volume Sports Fiesta"
          git push
